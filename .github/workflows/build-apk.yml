# Builds the PesoWise Android APK on GitHub's servers every time you push to main.
# Download it from the repo's Actions tab > latest "Build APK" run > Artifacts > PesoWise-APK.
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch: # lets you run it by hand from the Actions tab

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Build the web app
        working-directory: pesowise
        run: |
          npm install
          npm run build

      - name: Create the Cordova project
        run: |
          npm install -g cordova
          cordova create pesowise-cordova com.example.pesowise PesoWise
          cp pesowise/cordova/config.xml pesowise-cordova/config.xml
          rm -rf pesowise-cordova/www/*
          cp -r pesowise/dist/* pesowise-cordova/www/
          cd pesowise-cordova
          cordova platform add android
          cordova plugin add cordova-plugin-camera
          cordova plugin add cordova-plugin-vibration
          cordova plugin add cordova-plugin-fingerprint-aio

      - name: Build the APK
        working-directory: pesowise-cordova
        run: cordova build android

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: PesoWise-APK
          path: pesowise-cordova/platforms/android/app/build/outputs/apk/debug/app-debug.apk
